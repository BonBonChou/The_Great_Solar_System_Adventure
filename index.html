<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Card Play UI</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:'Noto Sans TC',sans-serif;
  color:#fff;
  overflow:hidden;
}

/* ===== 遊戲主畫布 ===== */
#game-screen{
  position:relative;
  width:100%;
  height:100vh;
}

/* ===== 提示訊息 ===== */
#toast{
  position:absolute;
  top:40%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.75);
  padding:0.8em 1.5em;
  border-radius:12px;
  font-size:1.2em;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.4s ease;
}
#toast.show{
  opacity:1;
}

/* ===== 手牌區 ===== */
#hand-area{
  position:absolute;
  bottom:0;
  width:100%;
  height:32vh;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:2vh;
}

/* ===== 單張牌 ===== */
.card{
  position:relative;
  width:70px;
  height:100px;
  margin-left:-30px; /* 覆蓋效果 */
  transition:transform 0.2s ease;
}

.card:first-child{
  margin-left:0;
}

.card img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

/* 凸出效果 */
.card.selected{
  transform:translateY(-30px);
}

/* 讓後面的牌在上層 */
.card{
  z-index:1;
}
.card:nth-child(2){z-index:2}
.card:nth-child(3){z-index:3}
.card:nth-child(4){z-index:4}
.card:nth-child(5){z-index:5}
.card:nth-child(6){z-index:6}
.card:nth-child(7){z-index:7}
.card:nth-child(8){z-index:8}

</style>
</head>

<body>

<div id="game-screen">

  <!-- 提示 -->
  <div id="toast">已達出牌上限</div>

  <!-- 手牌 -->
  <div id="hand-area">
    <!-- 假圖檔路徑，之後直接換 -->
    <div class="card" data-rank="2"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
    <div class="card" data-rank="3"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
    <div class="card" data-rank="4"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
    <div class="card" data-rank="J"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
    <div class="card" data-rank="Q"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
    <div class="card" data-rank="K"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
    <div class="card" data-rank="A"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
    <div class="card" data-rank="A2"><img src="https://raw.githubusercontent.com/BonBonChou/The_Great_Solar_System_Adventure/main/images/battery.png"></div>
  </div>

</div>

<script>
const MAX_SELECT = 5;
const toast = document.getElementById('toast');
const cards = document.querySelectorAll('.card');

let toastTimer = null;

function showToast(){
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.classList.remove('show');
  },2000);
}

function selectedCount(){
  return document.querySelectorAll('.card.selected').length;
}

cards.forEach(card=>{
  card.addEventListener('click',()=>{
    if(card.classList.contains('selected')){
      card.classList.remove('selected');
      return;
    }

    if(selectedCount() >= MAX_SELECT){
      showToast();
      return;
    }

    card.classList.add('selected');
  });
});
</script>

</body>
</html>
