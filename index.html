<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Card Play UI</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:'Noto Sans TC',sans-serif;
  color:#fff;
  overflow:hidden;
}

#game-screen{
  position:relative;
  width:100%;
  height:100vh;
}

/* ===== 提示 ===== */
#toast{
  position:absolute;
  top:40%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.75);
  padding:0.8em 1.5em;
  border-radius:12px;
  font-size:1.2em;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.4s ease;
}
#toast.show{ opacity:1; }

/* ===== 手牌區 ===== */
#hand-area{
  position:absolute;
  bottom:0;
  width:100%;
  height:32vh;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:2vh;
}

/* ===== 卡牌 ===== */
.card{
  position:relative;
  width:70px;
  height:100px;
  margin-left:-30px;
  transition:transform 0.2s ease;
}
.card:first-child{ margin-left:0; }

.card img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.card.selected{
  transform:translateY(-30px);
}

/* 疊放順序 */
.card{ z-index:1; }
.card:nth-child(2){z-index:2}
.card:nth-child(3){z-index:3}
.card:nth-child(4){z-index:4}
.card:nth-child(5){z-index:5}
.card:nth-child(6){z-index:6}
.card:nth-child(7){z-index:7}
.card:nth-child(8){z-index:8}

</style>
</head>

<body>

<div id="game-screen">

  <div id="toast">已達出牌上限</div>

  <div id="hand-area"></div>

</div>

<script>
/* ===== 基本設定 ===== */
const HAND_SIZE = 8;
const MAX_SELECT = 5;
const CARD_IMAGE_PATH = 'cards/'; // 你自己的路徑

const toast = document.getElementById('toast');
const handArea = document.getElementById('hand-area');

/* ===== 牌庫定義 ===== */
/*
  你之後只要改這個結構就好
  rank：牌面
  img：對應圖片檔名
*/
let deck = [
  { rank:'2', img:'2.png' },
  { rank:'3', img:'3.png' },
  { rank:'4', img:'4.png' },
  { rank:'5', img:'5.png' },
  { rank:'6', img:'6.png' },
  { rank:'7', img:'7.png' },
  { rank:'8', img:'8.png' },
  { rank:'9', img:'9.png' },
  { rank:'10', img:'10.png' },
  { rank:'J', img:'J.png' },
  { rank:'Q', img:'Q.png' },
  { rank:'K', img:'K.png' },
  { rank:'A', img:'A.png' }
];

/* ===== 工具 ===== */
function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [array[i],array[j]] = [array[j],array[i]];
  }
}

function selectedCount(){
  return document.querySelectorAll('.card.selected').length;
}

let toastTimer = null;
function showToast(){
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.classList.remove('show');
  },2000);
}

/* ===== 抽牌 ===== */
function drawHand(){
  handArea.innerHTML = '';
  shuffle(deck);

  const hand = deck.slice(0, HAND_SIZE);

  hand.forEach(cardData=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.rank = cardData.rank;

    const img = document.createElement('img');
    img.src = CARD_IMAGE_PATH + cardData.img;

    card.appendChild(img);

    card.addEventListener('click',()=>{
      if(card.classList.contains('selected')){
        card.classList.remove('selected');
        return;
      }

      if(selectedCount() >= MAX_SELECT){
        showToast();
        return;
      }

      card.classList.add('selected');
    });

    handArea.appendChild(card);
  });
}

/* ===== 初始化 ===== */
drawHand();
</script>

</body>
</html>
